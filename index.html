<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO - 极智性能 艺术设计</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary-color: #ff3e3e; /* 赛道红 */
            --bg-dark: #0a0a0a;
            --text-light: #ffffff;
            --accent-gray: #1a1a1a;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text-light);
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: #ccc;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* 英雄版块 (Hero Section) */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            background: 
                linear-gradient(45deg, rgba(0,0,0,0.9) 30%, transparent 70%),
                url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=2000') center/cover no-repeat;
            /* 这里可以替换为您自己的汽车大图 */
        }

        .hero-content {
            max-width: 600px;
        }

        .hero-content h1 {
            font-size: 80px;
            line-height: 1.1;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-style: italic;
        }

        .hero-content p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 45px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 2px;
            transition: transform 0.3s, background 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); /* 倾斜切角设计 */
        }

        .cta-button:hover {
            background-color: #cc0000;
            transform: translateX(10px);
        }

        /* 参数展示区 */
        .stats {
            position: absolute;
            bottom: 50px;
            display: flex;
            gap: 60px;
        }

        .stat-item h3 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .stat-item p {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        /* 浮动线条装饰 */
        .accent-line {
            width: 100px;
            height: 4px;
            background: var(--primary-color);
            margin-bottom: 20px;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 45px; }
            .nav-links { display: none; }
            .stats { gap: 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AERO</div>
        <div class="nav-links">
            <a href="#">型号</a>
            <a href="#">配置</a>
            <a href="#">科技</a>
            <a href="#">车主服务</a>
        </div>
        <div class="contact">
            <a href="#" style="color:white; text-decoration:none; border:1px solid white; padding: 8px 20px;">预约试驾</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <div class="accent-line"></div>
            <h1>EVOLUTION<br>OF SPEED.</h1>
            <p>重新定义未来驾驶体验。结合空气动力学精髓与纯电驱动核心，为您打造前所未有的纯粹驾控感。</p>
            
            <a href="#" class="cta-button">立即探索</a>

            <div class="stats">
                <div class="stat-item">
                    <h3>2.1s</h3>
                    <p>0-100 km/h</p>
                </div>
                <div class="stat-item">
                    <h3>850km</h3>
                    <p>CLTC 续航里程</p>
                </div>
                <div class="stat-item">
                    <h3>0.197</h3>
                    <p>风阻系数 Cd</p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
